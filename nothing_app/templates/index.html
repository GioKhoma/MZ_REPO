
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1 style="color: blue;">გამარჯობა, ეს არის ინდექს გვერდი!!!</h1>

    <h2>გამარჯობა, ჩემი სახელია: {{ name }}, ჩემი გვარია: {{ last_name }}</h2>


    {% if age > 18 %}
        <p style="size: 10px;">beberi xar</p>
    {% elif age >= 14 %}
        <p style="font-size: 100px;">mozardi xar</p>
    {% else %}
        <p>patara xar </p>
    {% endif %}


    {% for product in products %}
        <h1>{{ product }}</h1>
    {% endfor %}

</body>
</html>
